name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and runner
        run: |
          source script/version.sh
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
      - name: Test core
        run: |
          set -o pipefail
          mkdir -p artifacts
          swift test -c release 2>&1 | tee artifacts/core-tests.log
      - name: Build and package
        run: |
          set -o pipefail
          ./script/package.sh 2>&1 | tee artifacts/package.log
      - name: Verify package
        run: ./script/verify-package.sh
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ThreeBody-${{ github.sha }}
          path: |
            dist/*.pkg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.sha }}
          path: artifacts/*.log
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ThreeBody-${{ github.sha }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          source script/version.sh
          # A draft keeps assets reviewable and allows retrying failed uploads.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "ThreeBody $VERSION" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.pkg dist/*.zip dist/*.sha256 --clobber
          gh release edit "$RELEASE_TAG" --draft=false
